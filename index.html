<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5fc"><title>Time Account · 时间账户</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#292438;background:#f7f5fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:29px;margin:0}h2{font-size:20px;margin:0 0 16px}p{color:#777084}.muted{color:#777084;font-size:13px}.pill{background:#ece3ff;color:#7752bd;border-radius:30px;padding:6px 12px;font-size:12px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:#805dd1;color:white;padding:10px 15px}button.secondary{background:#eee8fa;color:#6544ac}button.danger{background:#ffedf0;color:#bd3d57}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #e4dfec;border-radius:10px;padding:11px;background:white;color:#292438}label{font-size:13px;font-weight:600;display:block;margin:10px 0 6px}.panel{background:white;border:1px solid #ece7f2;border-radius:20px;padding:22px;box-shadow:0 7px 24px #45346b08;margin-top:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.number{font-size:29px;font-weight:750;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:11px;background:#f0edf4;border-radius:10px;overflow:hidden;margin:15px 0 9px}.fill{height:100%;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.category{border-left:5px solid var(--accent)}.tabs{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}.tabs button{background:white;color:#756b83;border:1px solid #e9e3f0}.tabs button.active{background:#805dd1;color:white}.modalback{position:fixed;inset:0;background:#221a3680;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border-radius:19px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto}.row{display:flex;gap:10px}.row>*{flex:1}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eeeaf4}.entry:last-child{border-bottom:0}.hidden{display:none!important}.notice{background:#fff8e6;border:1px solid #f0dfa6;border-radius:12px;padding:12px;font-size:13px;color:#75602b;margin-top:15px}.over{color:#c8495e}.good{color:#368d61}canvas{width:100%;max-width:440px;height:250px}footer{margin-top:26px;text-align:center;font-size:12px;color:#968da2}@media(max-width:650px){.summary,.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 50px}.panel{padding:17px}.number{font-size:25px}}
</style></head><body><div class="wrap"><header><div><div class="pill" style="display:inline-block;margin-bottom:9px">PERSONAL TIME BUDGET</div><h1>⏳ Time Account</h1><p style="margin:6px 0">像记账一样管理时间，记录每一份投入。</p></div><div class="actions"><input type="month" id="month" style="width:155px"><button class="secondary" id="export">导出数据</button><button class="secondary" id="importBtn">导入数据</button><input type="file" id="importFile" accept="application/json" hidden></div></header><div class="notice">数据仅保存在当前浏览器中。GitHub Pages 不会自动跨设备同步；请定期导出备份。关闭网页后，进行中的计时器仍可根据开始时间恢复。</div><section class="summary" id="summary"></section><nav class="tabs"><button data-tab="budget" class="active">月度预算</button><button data-tab="entries">时间流水</button><button data-tab="report">月度分析</button></nav><section id="budgetView"><div class="topline" style="margin-top:20px"><h2>本月分类</h2><button id="addCategory">＋ 新建分类</button></div><div class="grid" id="categories"></div></section><section id="entriesView" class="hidden"><div class="panel"><h2>时间流水</h2><div id="entries"></div></div></section><section id="reportView" class="hidden"><div class="panel"><h2>预算 vs 实际</h2><div id="report"></div></div></section><footer>Time Account · 个人测试版 · 所有数据均在本机存储</footer></div><div class="modalback hidden" id="modalback"><div class="modal" id="modal"></div></div><script>
const KEY='time-account-v1';const colors=['#b59ae9','#f2aaa9','#4888ed','#50ad64','#e7b85d','#69b7b1'];const initial=[['找工作',12],['找客户',12],['视频及 X',6],['Addon 发布与维护',4]].map((x,i)=>({id:crypto.randomUUID(),name:x[0],budget:x[1],color:colors[i],outcomeLabel:'',outcomeValue:''}));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.categories)||!Array.isArray(db.entries))db={categories:initial,entries:[],running:null};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hours=n=>+(n/3600000).toFixed(2);const fmt=n=>Number(n.toFixed(2));const monthNow=()=>new Date().toLocaleDateString('en-CA').slice(0,7);$('month').value=monthNow();const month=()=>$('month').value;const entries=()=>db.entries.filter(e=>e.start.slice(0,7)===month());const used=id=>entries().filter(e=>e.categoryId===id).reduce((s,e)=>s+e.durationMs,0)/3600000;const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const modal=html=>{$('modal').innerHTML=html;$('modalback').classList.remove('hidden')};const close=()=>{$('modalback').classList.add('hidden');$('modal').innerHTML=''};$('modalback').onclick=e=>{if(e.target===$('modalback'))close()};const getcat=id=>db.categories.find(c=>c.id===id);const inMonth=()=>db.running&&db.running.start.slice(0,7)===month();function render(){const total=db.categories.reduce((s,c)=>s+c.budget,0),actual=db.categories.reduce((s,c)=>s+used(c.id),0);$('summary').innerHTML=[['本月预算',total+'h'],['实际投入',fmt(actual)+'h'],['预算余额',fmt(total-actual)+'h']].map(([t,v])=>`<div class="panel"><div class="muted">${t}</div><div class="number">${v}</div></div>`).join('');$('categories').innerHTML=db.categories.map(c=>{let u=used(c.id),diff=c.budget-u,running=db.running?.categoryId===c.id;return `<article class="panel category" style="--accent:${c.color};margin-top:0"><div class="topline"><h2 style="margin:0">${esc(c.name)}</h2><button class="secondary" onclick="editCategory('${c.id}')">设置</button></div><div class="number">${fmt(u)} <span class="muted">/ ${c.budget} 小时</span></div><div class="bar"><div class="fill" style="width:${c.budget?Math.min(100,u/c.budget*100):0}%;background:${u>c.budget?'#e56c76':c.color}"></div></div><div class="muted ${diff<0?'over':''}">${diff<0?'超出 '+fmt(-diff):'剩余 '+fmt(diff)} 小时 ${running?' · ⏱ 正在计时':''}</div>${c.outcomeLabel?`<p class="muted">本月产出：${esc(c.outcomeLabel)} · ${esc(c.outcomeValue||'未填写')}</p>`:''}<div class="actions" style="margin-top:18px"><button onclick="${running?`stopTimer()`:`startForm('${c.id}')`}">${running?'■ 结束计时':'▶ 开始计时'}</button><button class="secondary" onclick="manualForm('${c.id}')">＋ 手动记录</button></div></article>`}).join('');$('entries').innerHTML=entries().length?entries().sort((a,b)=>b.start.localeCompare(a.start)).map(e=>{const c=getcat(e.categoryId);return `<div class="entry"><div><b>${esc(e.task)}</b><div class="muted">${esc(c?.name||'已删除分类')} · ${new Date(e.start).toLocaleString('zh-CN')} · ${fmt(hours(e.durationMs))}h</div></div><div class="actions"><button class="secondary" onclick="editEntry('${e.id}')">修改</button><button class="danger" onclick="deleteEntry('${e.id}')">删除</button></div></div>`}).join(''):'<p>还没有时间记录。</p>';$('report').innerHTML=db.categories.map(c=>{let u=used(c.id);return `<div style="margin-bottom:24px"><div class="topline"><b>${esc(c.name)}</b><span class="${u>c.budget?'over':'good'}">${u>c.budget?'超支 '+fmt(u-c.budget):'剩余 '+fmt(c.budget-u)}h</span></div><p style="margin:7px 0">预算 ${c.budget}h · 实际 ${fmt(u)}h · ${c.budget?Math.round(u/c.budget*100):'—'}% 使用率</p><div class="bar"><div class="fill" style="width:${c.budget?Math.min(100,u/c.budget*100):0}%;background:${u>c.budget?'#e56c76':c.color}"></div></div>${c.outcomeLabel?`<div class="muted">${esc(c.outcomeLabel)}：${esc(c.outcomeValue||'未填写')}</div>`:''}</div>`}).join('');if(db.running){const c=getcat(db.running.categoryId);document.title='⏱ '+(c?.name||'计时中')+' · Time Account'}else document.title='Time Account · 时间账户'}
function startForm(id){if(db.running){alert('已有进行中的计时，请先结束。');return}const c=getcat(id);modal(`<h2>开始工作 · ${esc(c.name)}</h2><label>具体任务</label><input id="task" placeholder="例如：日本潜在客户调研"><div class="actions" style="margin-top:20px"><button id="startNow">▶ 开始计时</button><button class="secondary" onclick="close()">取消</button></div>`);$('startNow').onclick=()=>{const task=$('task').value.trim();if(!task){alert('请输入任务名称');return}db.running={categoryId:id,task,start:new Date().toISOString()};close();save()}}function stopTimer(){if(!db.running)return;const r=db.running;const ms=Date.now()-new Date(r.start).getTime();modal(`<h2>结束计时</h2><p>${esc(r.task)}</p><label>实际用时（分钟，可调整）</label><input id="elapsed" type="number" min="1" step="1" value="${Math.max(1,Math.round(ms/60000))}"><div class="actions" style="margin-top:20px"><button id="finish">保存记录</button><button class="secondary" onclick="close()">继续计时</button><button class="danger" id="discard">放弃本次</button></div>`);$('finish').onclick=()=>{const min=Number($('elapsed').value);if(!(min>0)){alert('请输入有效时长');return}db.entries.push({id:crypto.randomUUID(),categoryId:r.categoryId,task:r.task,start:r.start,durationMs:min*60000});db.running=null;close();save()};$('discard').onclick=()=>{if(confirm('放弃本次计时？')){db.running=null;close();save()}}}
function manualForm(id){modal(`<h2>手动记录</h2><label>任务名称</label><input id="task" placeholder="工作内容"><label>开始时间</label><input type="datetime-local" id="start" value="${monthNow()===month()?new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):month()+'-01T09:00'}"><label>时长（分钟）</label><input type="number" id="mins" value="60" min="1"><div class="actions" style="margin-top:20px"><button id="saveEntry">保存</button><button class="secondary" onclick="close()">取消</button></div>`);$('saveEntry').onclick=()=>{let task=$('task').value.trim(),min=Number($('mins').value),start=$('start').value;if(!task||!start||!(min>0)){alert('请填写完整');return}db.entries.push({id:crypto.randomUUID(),categoryId:id,task,start:new Date(start).toISOString(),durationMs:min*60000});close();save()}}
function editEntry(id){const e=db.entries.find(x=>x.id===id);if(!e)return;const d=new Date(e.start);const local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);modal(`<h2>修改时间记录</h2><label>任务</label><input id="task" value="${esc(e.task)}"><label>开始时间</label><input type="datetime-local" id="start" value="${local}"><label>时长（分钟）</label><input type="number" min="1" id="mins" value="${fmt(e.durationMs/60000)}"><div class="actions" style="margin-top:20px"><button id="saveEntry">保存修改</button><button class="secondary" onclick="close()">取消</button></div>`);$('saveEntry').onclick=()=>{const task=$('task').value.trim(),start=$('start').value,min=Number($('mins').value);if(!task||!start||!(min>0)){alert('请填写有效数据');return}Object.assign(e,{task,start:new Date(start).toISOString(),durationMs:min*60000});close();save()}}function deleteEntry(id){if(confirm('确定删除这条时间记录？')){db.entries=db.entries.filter(e=>e.id!==id);save()}}
function editCategory(id){const c=id?getcat(id):null;modal(`<h2>${c?'分类设置':'新建分类'}</h2><label>分类名称</label><input id="name" value="${esc(c?.name||'')}"><label>每月预算（小时）</label><input id="budget" type="number" min="0" step="0.5" value="${c?.budget??8}"><label>本月产出指标（可选）</label><input id="outcomeLabel" placeholder="例如：新增粉丝" value="${esc(c?.outcomeLabel||'')}"><label>本月实际产出（可选）</label><input id="outcomeValue" placeholder="例如：120 人" value="${esc(c?.outcomeValue||'')}"><div class="actions" style="margin-top:20px"><button id="saveCategory">保存</button><button class="secondary" onclick="close()">取消</button>${c?'<button class="danger" id="deleteCategory">删除分类</button>':''}</div>`);$('saveCategory').onclick=()=>{const name=$('name').value.trim(),budget=Number($('budget').value);if(!name||!(budget>=0)||!Number.isFinite(budget)){alert('请输入有效名称和预算');return}const props={name,budget,outcomeLabel:$('outcomeLabel').value.trim(),outcomeValue:$('outcomeValue').value.trim()};if(c)Object.assign(c,props);else db.categories.push({id:crypto.randomUUID(),color:colors[db.categories.length%colors.length],...props});close();save()};if(c)$('deleteCategory').onclick=()=>{if(db.running?.categoryId===id){alert('请先结束计时');return}if(db.entries.some(e=>e.categoryId===id)){alert('此分类已有历史记录，为避免丢失数据，暂不允许删除。可修改名称或预算。');return}if(confirm('删除此分类？')){db.categories=db.categories.filter(x=>x.id!==id);close();save()}}}
$('addCategory').onclick=()=>editCategory();$('month').onchange=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));['budget','entries','report'].forEach(t=>$(t+'View').classList.toggle('hidden',t!==b.dataset.tab));render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='time-account-backup-'+monthNow()+'.json';a.click();URL.revokeObjectURL(url)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.categories)||!Array.isArray(data.entries))throw Error('格式不正确');if(confirm('导入会覆盖当前所有本地数据，确定继续？')){db=data;save()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};render();
</script></body></html>
